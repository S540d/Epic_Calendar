# Dependabot – Variante für Expo-/React-Native-Projekte.
#
# Basis ist dependabot.yml (gleiche Drosselung, eine npm-Gruppe
# npm-minor-patch, Majors per ignore aus – Kommentare dort). Zusätzlich:
# SDK-gebundene Pakete bekommen GAR KEINE Dependabot-Updates.
#
# Warum: Dependabot kennt die Bindung an das Expo-SDK nicht.
#   - Es hebt Pakete über den SDK-Stand hinaus an (expo-router 58 auf SDK 55,
#     async-storage 3 obwohl auch SDK 58 bei 2.x bleibt;
#     Energy_Price_Germany#543, DrawFromMemory#389).
#   - Auch Patches sind nicht harmlos: Expo pinnt in bundledNativeModules.json
#     EXAKT (SDK 55: react 19.2.0, react-native-reanimated 4.2.1). Ein Patch-Bump
#     weicht vom SDK-Stand ab; react 19.2.0 → 19.2.9 ohne react-test-renderer
#     ließ alle Testsuites scheitern (DrawFromMemory#399, 2026-11-14).
#
# SDK-gebundene Pakete bewegt NUR Expo selbst:
#   - innerhalb des SDK:  `npx expo install --check` → `npx expo install <pakete>`
#     (gezielt; kein pauschales --fix, das schlägt auch Tooling-Majors vor)
#   - SDK-Upgrade:        `npx expo install expo@^<N> && npx expo install --fix`,
#     mit Gerätetest, als eigenes Issue.
#   Der monatliche Major-Report (monthly-major-report.yml) zeigt je Repo den
#   SDK-Stand an, damit beides nicht in Vergessenheit gerät.
#
# Was weiter über Dependabot läuft: Minor/Patch aller NICHT SDK-gebundenen
#   Pakete (Dev-Tooling, Lottie-Web, Sentry-Minor …) in npm-minor-patch.
#   Achtung bei 0.x-Paketen: dort zählt Dependabot 0.13 → 0.22 als „minor“,
#   semantisch ist das oft breaking (z. B. @lottiefiles/dotlottie-react).
#
# Security-Updates sind von ignore NICHT betroffen (GitHub-Doku, Stand 2026-11):
# Mit gesetztem target-branch gilt die ganze Konfiguration nicht für
# Security-PRs. Die kommen also weiter, allerdings gegen main (per Mini-PR nach
# testing ersetzen, siehe project-templates#185). Ein Security-Fix, der nur per
# SDK-Major lösbar ist, wird über das Audit-Gate befristet erlaubt und mit dem
# SDK-Upgrade aufgelöst.
#
# Repo-spezifische Zusätze unten im ignore-Block mit Begründung + Issue-Verweis.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "testing"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      # Kein update-types-Filter → Major landet mit im Sammel-PR.
      actions-all:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "testing"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      # Minor/Patch gesammelt – ein PR pro Monat.
      npm-minor-patch:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
    ignore:
      # ── Majors nie über Dependabot (Major-Report, s. dependabot.yml) ────
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ── SDK-gebunden: keine Updates (ohne update-types = alle) ──────────
      # Expo selbst
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "babel-preset-expo"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      # React / React Native (exakt gepinnt; Test-Renderer + Typen laufen mit)
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "@react-native/*"
      # Native Module aus bundledNativeModules.json. Generische Muster statt
      # Paketliste, damit neue Module automatisch erfasst sind. Nebenwirkung:
      # auch react-native-web hängt am SDK – passt.
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-picker/*"
      - dependency-name: "@shopify/react-native-skia"
      - dependency-name: "lottie-react-native"
      # ── Repo-spezifisch (mit Begründung + Issue) ────────────────────────
